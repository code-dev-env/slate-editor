<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Slate Editor</title>
    <style>
      :root {
        --bg: #fff;
        --bar: #f3f3f3;
        --tab: #ececec;
        --tab-active: #fff;
        --fg: #333;
        --border: #ddd;
        --accent: #007acc;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font:
          13px "Segoe UI",
          sans-serif;
        overflow: hidden;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #bar {
        display: flex;
        background: var(--bar);
        border-bottom: 1px solid var(--border);
        align-items: stretch;
      }
      #tabs {
        display: flex;
        flex: 1;
        overflow-x: auto;
      }
      #tabs::-webkit-scrollbar {
        height: 4px;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: var(--tab);
        border-right: 1px solid var(--border);
        cursor: pointer;
        white-space: nowrap;
        user-select: none;
      }
      .tab.active {
        background: var(--tab-active);
        box-shadow: inset 0 2px 0 var(--accent);
      }
      .tab .x {
        opacity: 0.6;
        padding: 0 4px;
        border-radius: 3px;
      }
      .tab .x:hover {
        opacity: 1;
        background: rgba(128, 128, 128, 0.3);
      }
      .dot {
        color: var(--accent);
      }
      button {
        background: none;
        border: none;
        color: var(--fg);
        padding: 0 14px;
        cursor: pointer;
        font-size: 15px;
      }
      button:hover {
        background: rgba(128, 128, 128, 0.2);
      }
      #editor {
        flex: 1;
      }
      #bar {
        position: relative;
      }
      #themes {
        display: none;
        position: absolute;
        top: 100%;
        right: 4px;
        z-index: 100;
        width: 300px;
        padding: 8px;
        background: var(--bar);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      #themes.open {
        display: grid;
      }
      #themes .opt {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid transparent;
      }
      #themes .opt:hover {
        background: rgba(128, 128, 128, 0.2);
      }
      #themes .opt.sel {
        border-color: var(--accent);
      }
      #themes .sw {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid rgba(128, 128, 128, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      #themes .sw i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      #drop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(128, 128, 128, 0.25);
        border: 3px dashed var(--accent);
        z-index: 99;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="bar">
        <div id="tabs"></div>
        <button id="open" title="Open file (Ctrl+O)">Open</button
        ><button id="new" title="New tab (Ctrl+N)">+</button
        ><button id="theme" title="Themes">◐ Themes</button>
        <div id="themes"></div>
      </div>
      <div id="editor"></div>
    </div>
    <div id="drop"></div>
    <script src="node_modules/monaco-editor/min/vs/loader.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
